[project]
name = "mandate"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "razorpay>=1.4",
    "groq>=0.11",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]